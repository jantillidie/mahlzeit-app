<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rezept - Mahlzeit</title>
        <link rel="stylesheet" href="assets/css/style.css" />
        <script src="assets/js/api.js" defer></script>
        <script src="assets/js/rezept.js" defer></script>
    </head>
    <body>
        <header>
            <nav class="top-nav-nav">
                <a href="index.html" class="top-nav-logo">Mahlzeit</a>
                <ul class="top-nav-ul">
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Entdecken</a>
                    </li>
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Kategorien</a>
                    </li>
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Zufallsrezept</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <p id="message"></p>
            <a href="index.html" class="back-link">← Zurück zur Übersicht</a>
            <article class="recipe" id="recipe">
                <img id="meal-image" class="recipe-img" src="" alt="" />
                <div class="recipe-head">
                    <div id="meal-tags" class=".recipe-card-category"></div>
                    <h1 id="meal-name" class="recipe-title"></h1>
                    <a
                        id="video-link"
                        class="search-btn recipe-video-btn"
                        href=""
                        target="_blank"
                        hidden
                        ><svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                fill="currentColor"
                                d="M8 5.14v14l11-7z"
                            /></svg
                        >Video ansehen</a
                    >
                    <a href="index.html" class="surprise-btn recipe-back-link"
                        >Anderes Rezept</a
                    >
                <section class="recipe-ingredients">
                    <h2>Zutaten</h2>
                    <ul id="ingredients"></ul>
                </section>
                </div>
                <section class="recipe-steps">
                    <h2>Zubereitung</h2>
                    <ol id="steps"></ol>
                </section>
            </article>
        </main>
        <footer>
            <p class="footer-content">
                Rezeptdaten von
                <a
                    href="https://themealdb.com"
                    target="_blank"
                    class="footer-link"
                    >TheMealDB.com</a
                >
            </p>
        </footer>
    </body>
</html>
