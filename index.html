<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mahlzeit</title>
        <link rel="stylesheet" href="assets/css/style.css" />
        <script src="assets/js/api.js" defer></script>
        <script src="assets/js/main.js" defer></script>
    </head>
    <body>
        <header>
            <nav class="top-nav-nav">
                <a href="index.html" class="top-nav-logo">Mahlzeit</a>
                <ul class="top-nav-ul">
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Entdecken</a>
                    </li>
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Kategorien</a>
                    </li>
                    <li class="top-nav-li">
                        <a href="#" class="top-nav-a">Zufallsrezept</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="homepage-main">
            <section class="intro-section">
                <h1 class="main-title">Was kochen wir heute?</h1>
                <p class="small-text">
                    Suche nach einem Gericht oder lass dich überraschen.
                </p>
            </section>
            <section class="search-section">
                <form action="" class="search-form" id="search-form">
                    <input
                        type="search"
                        class="search-input"
                        placeholder="z. B. Arrabiata"
                        aria-label="Gericht suchen"
                        id="search-input"
                    />
                    <button class="search-btn" id="search-btn">
                        <svg
                            class="search-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                fill="none"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M19 11.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 0 1 15 0m-2.107 5.42l3.08 3.08"
                            />
                        </svg>
                        Suchen
                    </button>
                </form>
                <button class="surprise-btn" id="surprise-btn" type="button">
                    <svg
                        class="surprise-icon"
                        viewBox="0 0 14 14"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            fill="none"
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m.5 13.5l13-13m-4 0h4v4M9 9l4.5 4.5m-4 0h4v-4M5 5L.5.5"
                        />
                    </svg>
                    Überrasch mich
                </button>
            </section>
            <section class="categories-section">
                <button class="category-btn"></button>
                <button class="category-btn category-btn-inactive"></button>
            </section>
            <h2>Gerichte</h2>
            <p id="message"></p>
            <section class="recipes-section" id="recipes"></section>
        </main>
        <footer>
            <p class="footer-content">
                Rezeptdaten von
                <a
                    href="https://themealdb.com"
                    target="_blank"
                    class="footer-link"
                    >TheMealDB.com</a
                >
            </p>
        </footer>
    </body>
</html>
